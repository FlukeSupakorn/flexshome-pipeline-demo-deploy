apiVersion: v1
kind: ResourceQuota
metadata:
  name: pipeline-demo
spec:
  hard:
    requests.cpu: 200m
    requests.memory: 256Mi
    limits.cpu: "1"
    limits.memory: 512Mi
    pods: "3"
    services: "2"
    count/persistentvolumeclaims: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: pipeline-demo
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 25m
        memory: 32Mi
      default:
        cpu: 250m
        memory: 128Mi
