name: Manifest CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  ci:
    uses: FlukeSupakorn/flexshome-platform/.github/workflows/validate-manifests.yaml@b0034d4f25aca73320d9468fb5d824bda57964dd
    with:
      mode: manifest
      application_id: pipeline-demo
      source_repository: FlukeSupakorn/flexshome-pipeline-demo
      source_repository_id: '1440607759'
      reader_app_id: ${{ vars.READER_APP_ID }}
    secrets:
      READER_APP_PRIVATE_KEY: ${{ secrets.READER_APP_PRIVATE_KEY }}
